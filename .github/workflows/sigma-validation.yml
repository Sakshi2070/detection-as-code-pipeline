name: Sigma Detection Validation

on:
  push:
    paths:
      - 'rules/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/sigma-validation.yml'
  pull_request:
    paths:
      - 'rules/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/sigma-validation.yml'

jobs:
  validate-sigma:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sigma-cli pytest pyyaml

      - name: Install Splunk backend
        run: |
          sigma plugin install splunk

      - name: Validate Sigma rules
        run: |
          sigma check rules/windows/*.yml

      - name: Run detection tests
        run: |
          pytest -v tests/test_detections.py

      - name: Convert Sigma rules to Splunk
        run: |
          mkdir -p output
          for rule in rules/windows/*.yml; do
            filename=$(basename "$rule" .yml)
            sigma convert -t splunk -p splunk_windows "$rule" > "output/${filename}.spl"
          done

      - name: Upload Splunk detections
        uses: actions/upload-artifact@v4
        with:
          name: splunk-detections
          path: output/
          
